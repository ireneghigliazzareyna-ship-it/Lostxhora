<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard FBM Issues - MXNL01</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfaf6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --meli-yellow: #fff159;
            --success-green: #00a650;
            --danger-red: #e32636;
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- TARJETAS KPI (Superior) --- */
        .kpi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: var(--card-bg);
            flex: 1;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-bottom: 4px solid var(--success-green);
        }

        .kpi-card h3 {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .kpi-card .value {
            font-size: 42px;
            font-weight: 900;
            color: var(--success-green);
        }

        /* --- GRÁFICOS (Medio) --- */
        .charts-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .chart-card {
            background: var(--card-bg);
            flex: 1;
            min-width: 400px;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 350px;
        }

        .chart-card h3 {
            text-align: center;
            font-size: 16px;
            color: var(--success-green);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .canvas-wrapper {
            position: relative;
            height: 280px;
            width: 100%;
        }

        /* --- TABLA (Inferior) --- */
        .table-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background-color: #666666;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        th {
            text-transform: uppercase;
            font-weight: 700;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        /* Badges de estado */
        .badge-conciliado {
            background-color: #d4edda;
            color: #155724;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }
        
        .badge-pendiente {
            background-color: #f8d7da;
            color: #721c24;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- KPIs -->
        <div class="kpi-container">
            <div class="kpi-card">
                <h3>Total Piezas Afectadas</h3>
                <div class="value" id="kpi-piezas">Cargando...</div>
            </div>
            <div class="kpi-card">
                <h3>Monto Total Perdido</h3>
                <div class="value" id="kpi-monto">Cargando...</div>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="charts-container">
            <div class="chart-card">
                <h3>Hallazgos por Proceso</h3>
                <div class="canvas-wrapper">
                    <canvas id="donutChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>Monto por Categoría HV</h3>
                <div class="canvas-wrapper">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Tabla de Datos -->
        <div class="table-card">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Fecha Hora</th>
                        <th>Inventory ID</th>
                        <th>Categoría</th>
                        <th>Proceso Detonador</th>
                        <th>Condición</th>
                        <th>Total Piezas</th>
                        <th>Monto Perdido</th>
                        <th>Estado Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="8">Esperando datos del servidor...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // Función principal para cargar y renderizar los datos
        async function loadDashboardData() {
            try {
                // 1. Cargar el JSON que n8n guardará en el repositorio
                // El timestamp evita que el navegador use una versión vieja de la caché
                const response = await fetch('data.json?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error("Aún no existe el archivo data.json o hay un error en la ruta.");
                }
                
                const data = await response.json();

                // Limpiar la tabla por si decía "Esperando datos..."
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = '';

                // Si el archivo está vacío
                if (!data || data.length === 0) {
                    document.getElementById('kpi-piezas').innerText = '0';
                    document.getElementById('kpi-monto').innerText = '$0.00';
                    tbody.innerHTML = '<tr><td colspan="8">No hay datos disponibles en este momento.</td></tr>';
                    return;
                }

                // 2. Calcular KPIs
                const totalPiezas = data.reduce((acc, curr) => acc + (curr.cantidad_total_piezas || 0), 0);
                const totalMonto = data.reduce((acc, curr) => acc + (curr.monto_total_perdido || 0), 0);

                document.getElementById('kpi-piezas').innerText = totalPiezas;
                document.getElementById('kpi-monto').innerText = '$' + totalMonto.toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});

                // 3. Preparar datos para gráficos
                const procesoAgrupado = {};
                const categoriaAgrupada = {};

                data.forEach(row => {
                    if(row.proceso_detonador) {
                        procesoAgrupado[row.proceso_detonador] = (procesoAgrupado[row.proceso_detonador] || 0) + (row.cantidad_total_piezas || 0);
                    }
                    if(row.categoria_hv) {
                        categoriaAgrupada[row.categoria_hv] = (categoriaAgrupada[row.categoria_hv] || 0) + (row.monto_total_perdido || 0);
                    }
                });

                // 4. Renderizar Donut Chart (Procesos)
                new Chart(document.getElementById('donutChart'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(procesoAgrupado),
                        datasets: [{
                            data: Object.values(procesoAgrupado),
                            backgroundColor: ['#ff4d4d', '#4d79ff', '#ffb34d', '#00cc99', '#9933ff', '#ff66b2', '#00cccc'],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'right' } }
                    }
                });

                // 5. Renderizar Bar Chart (Categoría HV)
                new Chart(document.getElementById('barChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(categoriaAgrupada),
                        datasets: [{
                            label: 'Monto Perdido ($)',
                            data: Object.values(categoriaAgrupada),
                            backgroundColor: ['#4d79ff', '#ff4d4d', '#ffb34d'],
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true } }
                    }
                });

                // 6. Poblar Tabla
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    let estadoHTML = '';
                    if (row.monto_conciliado > 0) {
                        estadoHTML = `<span class="badge-conciliado">CONCILIADO</span>`;
                    } else {
                        estadoHTML = `<span class="badge-pendiente">PENDIENTE</span>`;
                    }

                    tr.innerHTML = `
                        <td>${row.fecha_hora || '-'}</td>
                        <td>${row.INVENTORY_ID || '-'}</td>
                        <td>${row.categoria_hv || '-'}</td>
                        <td>${row.proceso_detonador || '-'}</td>
                        <td>${row.FBM_ISSUE_CONDITION || '-'}</td>
                        <td>${row.cantidad_total_piezas || 0}</td>
                        <td>$${(row.monto_total_perdido || 0).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td>${estadoHTML}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error cargando los datos del JSON:", error);
                document.getElementById('kpi-piezas').innerText = "Error";
                document.getElementById('kpi-monto').innerText = "Error";
                document.querySelector('#dataTable tbody').innerHTML = `<tr><td colspan="8" style="color:red;">Falla al cargar datos: ${error.message}. (Asegúrate de que n8n haya subido el archivo data.json)</td></tr>`;
            }
        }

        // Ejecutar al cargar la página
        window.onload = loadDashboardData;
    </script>
</body>
</html>
