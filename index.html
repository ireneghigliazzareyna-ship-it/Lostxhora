<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard FBM Issues - MXNL01</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #fcfbf5; /* Fondo crema idéntico a la imagen */
            --bg-card: #ffffff;
            --text-title: #4a5a75; /* Azul oscuro para títulos */
            --text-kpi: #25d366; /* Verde brillante para números */
            --border-radius: 12px;
            --shadow: 0 4px 10px rgba(0,0,0,0.06);
            --danger: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-app); padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Pestañas */
        .tabs { display: flex; gap: 15px; margin-bottom: 20px; }
        .tab-btn { background: #e0e0e0; border: none; font-size: 15px; font-weight: bold; color: #555; cursor: pointer; padding: 12px 25px; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: #2968c8; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Barra de Filtros (Estilo Imagen 1) */
        .filter-bar { background: var(--bg-card); padding: 20px; border-radius: var(--border-radius); box-shadow: var(--shadow); display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 12px; font-weight: 900; color: #333; text-transform: uppercase; }
        .filter-group input, .filter-group select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; color: #555; background: #fafafa; }
        .search-box { flex: 2; }

        /* Tarjetas KPI (Estilo Imagen 1) */
        .kpi-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .kpi-card { background: var(--bg-card); flex: 1; padding: 30px; border-radius: var(--border-radius); text-align: center; box-shadow: var(--shadow); border-bottom: 5px solid var(--text-kpi); }
        .kpi-card h3 { font-size: 15px; color: var(--text-title); text-transform: uppercase; margin-bottom: 15px; font-weight: 900; }
        .kpi-card .value { font-size: 48px; font-weight: 900; color: var(--text-kpi); }
        .kpi-card.danger { border-bottom: 5px solid var(--danger); }
        .kpi-card.danger .value { color: var(--danger); }

        /* Gráficos */
        .charts-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .chart-card { background: var(--bg-card); padding: 20px; border-radius: var(--border-radius); box-shadow: var(--shadow); }
        .chart-card h3 { text-align: center; font-size: 15px; color: var(--text-kpi); text-transform: uppercase; margin-bottom: 20px; font-weight: 900; }
        .canvas-wrapper { position: relative; height: 300px; width: 100%; }

        /* Tablas */
        .tables-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .table-card { background: var(--bg-card); padding: 20px; border-radius: var(--border-radius); box-shadow: var(--shadow); overflow: hidden; }
        .table-card h3 { margin-bottom: 15px; font-size: 15px; text-transform: uppercase; font-weight: 900; }
        .table-wrapper { max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #f0f0f0; color: #333; padding: 12px; text-align: left; position: sticky; top: 0; z-index: 1; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: #555; }
        
        /* Iframe Histórico */
        .historico-iframe { width: 100%; height: 850px; border: none; border-radius: var(--border-radius); box-shadow: var(--shadow); }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Pestañas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('dashboard')">📊 Dashboard Actual</button>
            <button class="tab-btn" onclick="switchTab('historico')">📅 Histórico de Data</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="tab-content active">
            
            <!-- Barra de Filtros Visuales -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label>Rango de Fechas (Hora Actual):</label>
                    <input type="text" value="Última actualización (Auto)" readonly>
                </div>
                <div class="filter-group">
                    <label>Almacén:</label>
                    <select disabled><option>MXNL01</option></select>
                </div>
                <div class="filter-group search-box">
                    <label>Buscar ID Meli / Texto:</label>
                    <input type="text" id="searchInput" placeholder="Ej. MELI123..." onkeyup="filterTables()">
                </div>
            </div>

            <!-- KPIs -->
            <div class="kpi-container">
                <div class="kpi-card">
                    <h3>Total Piezas Afectadas</h3>
                    <div class="value" id="kpi-piezas">0</div>
                </div>
                <div class="kpi-card danger">
                    <h3>Monto Total Pendiente</h3>
                    <div class="value" id="kpi-monto-pend">$0.00</div>
                </div>
                <div class="kpi-card">
                    <h3>Monto Total Conciliado</h3>
                    <div class="value" id="kpi-monto-conc">$0.00</div>
                </div>
            </div>

            <!-- Gráficos -->
            <div class="charts-container">
                <div class="chart-card">
                    <h3>Hallazgos por Proceso</h3>
                    <div class="canvas-wrapper"><canvas id="procesoChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>Estatus de Conciliación</h3>
                    <div class="canvas-wrapper"><canvas id="conciliacionChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>Impacto Categoría HV</h3>
                    <div class="canvas-wrapper"><canvas id="hvChart"></canvas></div>
                </div>
            </div>

            <!-- Tablas -->
            <div class="tables-container">
                <div class="table-card">
                    <h3 style="color: var(--danger);">🔴 Casos Pendientes de Conciliación</h3>
                    <div class="table-wrapper">
                        <table id="table-pendientes">
                            <thead><tr><th>ID Inventario</th><th>Proceso</th><th>Piezas</th><th>Monto</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                <div class="table-card">
                    <h3 style="color: var(--text-kpi);">🟢 Casos Conciliados (MELI)</h3>
                    <div class="table-wrapper">
                        <table id="table-conciliados">
                            <thead><tr><th>ID Inventario</th><th>Proceso</th><th>Piezas</th><th>Monto</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- HISTÓRICO -->
        <div id="historico" class="tab-content">
            <iframe id="iframe-sheets" class="historico-iframe" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRnz8QbwjCJSn9amIk7TjxweQ-x5MmwrqTJ7H9JtB39n0JbP8PRL6n4ZoaWR1t9oK2g_EpBX9E1dysa/pubhtml?gid=621702428&single=true"></iframe>
        </div>

    </div>

    <script>
        // Cambiar pestañas
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Búsqueda en tablas
        function filterTables() {
            const filter = document.getElementById("searchInput").value.toUpperCase();
            const tables = [document.getElementById("table-pendientes"), document.getElementById("table-conciliados")];
            
            tables.forEach(table => {
                const tr = table.getElementsByTagName("tr");
                for (let i = 1; i < tr.length; i++) {
                    const td = tr[i].getElementsByTagName("td")[0]; // Filtra por la columna 0 (ID Inventario)
                    if (td) {
                        const txtValue = td.textContent || td.innerText;
                        tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                    }
                }
            });
        }

        // Lógica principal de carga de datos
        async function loadDashboardData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) return;
                const data = await response.json();

                if (!data || data.length === 0) return;

                let totalPiezas = 0, montoPendiente = 0, montoConciliado = 0;
                const procesosMap = {}, hvMap = {};

                // 1. SANITIZAR DATOS (Convertir texto de BigQuery a Números Reales)
                data.forEach(row => {
                    const piezas = parseFloat(row.cantidad_total_piezas) || 0;
                    const montoTotal = parseFloat(row.monto_total_perdido) || 0;
                    const pend = parseFloat(row.monto_pendiente) || 0;
                    const conc = parseFloat(row.monto_conciliado) || 0;
                    const proceso = row.proceso_detonador || 'Sin Especificar';
                    const hv = row.categoria_hv || 'NO_HV';

                    // Sumatorias KPIs
                    totalPiezas += piezas;
                    montoPendiente += pend;
                    montoConciliado += conc;

                    // Agrupaciones para gráficas
                    procesosMap[proceso] = (procesosMap[proceso] || 0) + montoTotal;
                    hvMap[hv] = (hvMap[hv] || 0) + montoTotal;
                });

                // 2. IMPRIMIR KPIs
                document.getElementById('kpi-piezas').innerText = totalPiezas.toLocaleString('es-MX');
                document.getElementById('kpi-monto-pend').innerText = '$' + montoPendiente.toLocaleString('es-MX', {minimumFractionDigits: 2});
                document.getElementById('kpi-monto-conc').innerText = '$' + montoConciliado.toLocaleString('es-MX', {minimumFractionDigits: 2});

                // 3. PALETA DE COLORES MERCADO LIBRE
                const colores = ['#2968c8', '#ffb34d', '#00a650', '#ff4d4d', '#9933ff', '#00cccc', '#ff66b2'];

                // Gráfica 1: Procesos (Donut como imagen 1)
                new Chart(document.getElementById('procesoChart'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(procesosMap),
                        datasets: [{ data: Object.values(procesosMap), backgroundColor: colores, borderWidth: 2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } } }
                });

                // Gráfica 2: Conciliación (Pie)
                new Chart(document.getElementById('conciliacionChart'), {
                    type: 'pie',
                    data: {
                        labels: ['Pendiente', 'Conciliado'],
                        datasets: [{ data: [montoPendiente, montoConciliado], backgroundColor: ['#ff4d4d', '#00a650'], borderWidth: 2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });

                // Gráfica 3: HV (Barra Vertical)
                new Chart(document.getElementById('hvChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(hvMap),
                        datasets: [{
                            label: 'Monto Perdido ($)',
                            data: Object.values(hvMap),
                            backgroundColor: ['#2968c8', '#ffb34d'],
                            borderRadius: 6
                        }]
                    },
                    options: { 
                        responsive: true, maintainAspectRatio: false, 
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, ticks: { callback: function(value) { return '$' + value; } } } }
                    }
                });

                // 4. LLENAR TABLAS
                const tbodyPendientes = document.querySelector('#table-pendientes tbody');
                const tbodyConciliados = document.querySelector('#table-conciliados tbody');

                data.forEach(row => {
                    const piezas = parseFloat(row.cantidad_total_piezas) || 0;
                    const monto = parseFloat(row.monto_total_perdido) || 0;
                    const montoConc = parseFloat(row.monto_conciliado) || 0;

                    const htmlRow = `
                        <tr>
                            <td><strong>${row.INVENTORY_ID || '-'}</strong></td>
                            <td>${row.proceso_detonador || '-'}</td>
                            <td>${piezas.toLocaleString('es-MX')}</td>
                            <td>$${monto.toLocaleString('es-MX', {minimumFractionDigits: 2})}</td>
                        </tr>
                    `;

                    if (montoConc > 0) {
                        tbodyConciliados.innerHTML += htmlRow;
                    } else {
                        tbodyPendientes.innerHTML += htmlRow;
                    }
                });

            } catch (error) { console.error("Error:", error); }
        }

        window.onload = loadDashboardData;
    </script>
</body>
</html>
